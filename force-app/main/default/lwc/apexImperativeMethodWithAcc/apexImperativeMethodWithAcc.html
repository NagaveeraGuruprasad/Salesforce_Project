<template>
    <lightning-card title="Apex Imperative Method With Accounts" icon-name="custom:custom63">
            <div class="slds-var-m-around_medium">
                <p>
                    <lightning-button label="Load Accounts" onclick={LoadAccount}> </lightning-button>
                </p>
                 <template lwc:if={accountsData}>
                    <template for:each={accountsData} for:item="getaccountsData">
                        <p key={getaccountsData.Id}> {getaccountsData.Name}</p>
                    </template>
                 </template>
                 <template lwc:elseif={error}>
                     <c-error-panel errors={error}></c-error-panel>
                 </template>
            </div>
    </lightning-card>
</template>
