<template>
    <lightning-card title="HelloForEach" icon-name="custom:custom14">
        <div class="slds-m-around_medium">
    <lightning-input type="checkbox" label="Show List of CEO" onchange={handlechange}>
        </lightning-input>
        <template if:true ={areDetailsVisible} for:each={eoList} for:item="ceo">
            <div key ={ceo.id} class="slds-box">
            <div class="slds-grid slds-gutters">
            <div class="slds-col slds-size_1-of-3">
             <span> {ceo.Name}</span>
            </div>
            <div class="slds-col slds-size_1-of-3">  
            <span> {ceo.Company} </span>   
        </div>
       </div>
      </div>
     </template>
    </div>     
</lightning-card>
</template>
