<template>
    <lightning-card title="ApexImperativeMethodV1" icon-name="custom:custom63" >
    <div class="slds-var-m-around_medium">
        <P class="slds-var-m-bottom_small"> 
         <lightning-button label = "Load Contacts" onclick={handleLoad} > </lightning-button>
               
        </P>
        <template lwc:if={contactList}> 
            <template for:each={contactList} for:item = "getContactdataList"> 
                <p key={getContactdataList.Id}> {getContactdataList.Name} </p>
            </template>
        </template>
        <template lwc:if={error}>
             <c-error-panel errors={error}></c-error-panel>
        </template>

    </div>    
    
    </lightning-card>
</template>
