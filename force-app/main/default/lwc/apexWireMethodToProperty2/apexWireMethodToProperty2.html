<template>
    <lightning-card title="ApexWireMethodToProperty1" icon-name="custom:custom63">
        <div class="slds-var-m-around_medium">
        <template lwc:if={Contacts}>
            <template for:each={Contacts.data} for:item="con">
                <p key={con.id}> {con.Name} </p> 
                <p key={con.id}> {con.Title} </p> 
                <p key={con.id}> {con.Phone} </p> 
            </template>
        </template>
            <template lwc:elseif={contacts.error}>
            <c-error-panel errors={contacts.error}></c-error-panel>
            </template>
        </div>
    </lightning-card>
</template>
